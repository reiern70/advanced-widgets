# The production site: Caddy terminates HTTPS (Let's Encrypt certificates, renewed by itself)
# and passes everything, websockets included, to Jetty; PostgreSQL keeps the users and the
# accesses. Settings come from .env, see .env.example.

# the logs of every container: at most 3 files of 10 MB, so they never fill the disk
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: antilia-widgets:latest
    restart: unless-stopped
    environment:
      JAVA_OPTIONS: ${JAVA_OPTIONS}
      # the PostgreSQL of this file, unless .env names another one (a managed database)
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/widgets}
      DATABASE_USER: ${DATABASE_USER:-widgets}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      ANTILIA_WIDGETS_ACCOUNTS: ${ANTILIA_WIDGETS_ACCOUNTS:-}
      # the emails confirming a registration; without SMTP_HOST registering is closed
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # where the links of the emails point: Jetty only sees the requests Caddy passes on
      SITE_URL: https://${DOMAIN}
    volumes:
      - page-store:/var/lib/antilia-widgets
    expose:
      - "8080"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL on the instance's SSD; only the app reaches it, no port is published. Sized for
  # the 2 GB instance next to a JVM of 1 GB: the pool of the app uses 5 connections at most.
  # Backed up every night by backup.sh, see README.md.
  db:
    image: postgres:17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
      - -c
      - wal_compression=on
      # queries slower than a second go to the log
      - -c
      - log_min_duration_statement=1000
    shm_size: 256mb
    logging: *logging
    environment:
      POSTGRES_DB: widgets
      POSTGRES_USER: ${DATABASE_USER:-widgets}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d widgets"]
      interval: 5s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  database:
  page-store:
  caddy-data:
  caddy-config:
