# The production site: Caddy terminates HTTPS (Let's Encrypt certificates, renewed by itself)
# and passes everything, websockets included, to Jetty. No database: the site counts its visits
# in a text file a day on the volume page-store, by a cookie holding a random number, nothing else. Settings come from .env, see .env.example. The images are pinned by their digests, the
# tag kept to be read; Dependabot proposes the next ones (see .github/dependabot.yml), and deploy.sh
# pulls them.

# the logs of every container: at most 3 files of 10 MB, so they never fill the disk
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every container runs on a read-only file system, writing only into its volumes and tmpfs, with
# no capabilities of Linux beyond those it needs, gains no privileges (no setuid), and has a limit
# of memory, the two together fitting the 2 GB instance.

services:
  app:
    build: .
    image: antilia-widgets:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # a heap of 1 GB at most (-Xmx1g, see .env.example) and what the JVM needs besides it
    mem_limit: 1400m
    tmpfs:
      # the command line Jetty starts with, made anew from JAVA_OPTIONS at every start
      - /run/jetty:size=1m,mode=1777
    environment:
      JAVA_OPTIONS: ${JAVA_OPTIONS}
      # the administrator's password; without one there is no administrator
      ANTILIA_WIDGETS_ADMIN_PASSWORD: ${ANTILIA_WIDGETS_ADMIN_PASSWORD:-}
      # the token of the visits as JSON, /api/stats, which start.sh makes; without one only the
      # administrator's session gets them
      ANTILIA_WIDGETS_STATS_TOKEN: ${ANTILIA_WIDGETS_STATS_TOKEN:-}
      # the address of the site, whose pages the websockets connect from: Jetty only sees the
      # requests Caddy passes on
      SITE_URL: https://${DOMAIN}
    volumes:
      # the page store, emptied at every start, and the visits, a file a day kept 13 months
      - page-store:/var/lib/antilia-widgets
      # the temporary folder of Jetty and of the demo, the uploads and the images of the rich
      # text editors (up to some 200 MB): on the disk, not in memory as a tmpfs would hold it
      - temporary:/tmp
    expose:
      - "8080"
    logging: *logging

  caddy:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # the ports 80 and 443; the binary of Caddy carries this capability, which it cannot start
    # without once the others are dropped
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  page-store:
  temporary:
  caddy-data:
  caddy-config:
