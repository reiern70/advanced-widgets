<wicket:extend xmlns:wicket="http://wicket.apache.org">
<main class="container demo">
	<nav class="demo__nav">
		<a class="demo__back" wicket:id="back">&larr; <wicket:message key="backToHome"/></a>
		<span class="demo__steps">
			<a class="demo__step" wicket:id="previous">&lsaquo; <span wicket:id="name">[previous demo]</span></a>
			<a class="demo__step" wicket:id="next"><span wicket:id="name">[next demo]</span> &rsaquo;</a>
		</span>
	</nav>

	<wicket:child/>
</main>
</wicket:extend>
