resize=Resizable
resize.NONE=not
resize.STRETCH=stretching the table
resize.help=Whether the user can resize the columns by dragging the right edge of a header. The table has a ResizableColumnsBehavior then and grows as a column does; the selection, #, Actions and ID columns cannot be resized.
width=Width
width.content=by the columns
width.parent=full width
width.help=Whether the table is as wide as its columns or takes the full width of the page, following the size of the window until a column is resized.
proportions=Proportions
proportions.content=by content
proportions.set=set by the page
proportions.help=Whether the columns share the width by their content or by proportions the page sets.
navigation=Navigation
navigation.TOP=top
navigation.BOTTOM=bottom
navigation.BOTH=both
navigation.help=Where the paging links, the rows per page and the actions on the whole table are shown: above the headers, below the rows or both.
selectionBar=Bulk selection toolbar position
selectionBar.help=Where the bar offering to select every contact is shown, once every row of the page is selected.
bodyHeightUnits=Body height unit
bodyHeightUnits.PIXELS=pixels
bodyHeightUnits.PERCENT=percent of the parent's height
bodyHeightUnits.VIEWPORT_HEIGHT=percent of the window's height
bodyHeightUnits.help=The unit of the height of the body. Choosing one sets the height to 800 pixels, or to 100 percent of the parent's or the window's height. Percent of the parent gives the table a parent 600 pixels high.
bodyHeight=Body height (negative: by the rows)
bodyHeight.help=The height of the rows between the headers and the footer, in the unit above. Only the rows scroll; a negative height lets the body take the height of its rows.
overlay=Edit form and confirmation
overlay.LOCAL=over the table
overlay.BODY=over the page
overlay.help=Where the edit form and the delete confirmation are shown: over the table only, or over the whole page.
icons=Icons
icons.BUILT_IN=built in
icons.SVG=SvgIcon, inline SVG
icons.FONT_AWESOME=FontAwesomeIcon, font
icons.help=Which icons the actions show: the ones built into ui-components, the Font Awesome icons as inline SVG, or the same icons drawn by the Font Awesome font.
theme=Theme
theme.help=The colors of the table, its progress bars and the explanation, a theme of ui-components switched by a CSS class.
columnState=Column state
columnState.session=in the session
columnState.file=in a file
columnState.help=Where the order, visibility and widths of the columns are kept: in the session, or in a file of the temporary directory that survives restarts of the server.
resetColumns=Reset the columns
