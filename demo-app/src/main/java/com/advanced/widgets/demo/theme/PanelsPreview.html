<wicket:panel xmlns:wicket="http://wicket.apache.org">
<div class="theme-preview-panels">
	<div wicket:id="collapsible"></div>
	<div wicket:id="floating"></div>
	<div wicket:id="tabs"></div>
	<p><a href="#" wicket:id="openDialog"><wicket:message key="openDialog"/></a></p>
	<div wicket:id="dialog"></div>
</div>
<wicket:fragment wicket:id="tabContent"><p><wicket:message key="tabContent"/> <span wicket:id="text"></span></p></wicket:fragment>
<wicket:fragment wicket:id="dialogContent">
	<h1 class="modal-dialog-header"><wicket:message key="dialog.title"/></h1>
	<div class="modal-dialog-body"><p><wicket:message key="dialog.body"/></p></div>
	<div class="modal-dialog-footer"><a href="#" wicket:id="close"><wicket:message key="dialog.close"/></a></div>
</wicket:fragment>
</wicket:panel>
