<wicket:extend xmlns:wicket="http://wicket.apache.org">
		<main>
			<section class="hero">
				<div class="container">
					<h1>Advanced Widgets</h1>
					<p class="hero__lead">
						Reusable Apache Wicket components with Ajax and real-time (websocket) support.
					</p>
					<p class="hero__meta">
						<strong wicket:id="componentCount">0</strong> components in the catalog
						<span class="ws-status" wicket:id="webSocketStatus" title="WebSocket connection">Connecting</span>
					</p>
				</div>
			</section>

			<section class="container demos">
				<h2>Demos</h2>
				<ul class="cards">
					<li class="card" wicket:id="demos">
						<a class="card__link" wicket:id="link">
							<div class="card__head">
								<span class="card__category" wicket:id="category">Category</span>
								<span class="badge" wicket:id="visibility">Public</span>
							</div>
							<h3 class="card__name" wicket:id="name">Demo</h3>
							<p class="card__description" wicket:id="description">Description</p>
						</a>
					</li>
				</ul>
			</section>

			<section class="container catalog">
				<h2>Components</h2>
				<ul class="cards">
					<li class="card" wicket:id="components">
						<div class="card__head">
							<span class="card__category" wicket:id="category">Category</span>
							<span class="badge" wicket:id="status">Status</span>
						</div>
						<h3 class="card__name" wicket:id="name">Component</h3>
						<p class="card__description" wicket:id="description">Description</p>
					</li>
				</ul>
			</section>
		</main>
</wicket:extend>
