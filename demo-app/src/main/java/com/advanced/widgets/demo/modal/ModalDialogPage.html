<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="feedback"></div>
<div wicket:id="themed" class="team-demo">
	<div class="team-demo__toolbar">
		<h2 class="team-demo__title"><wicket:message key="team"/></h2>
		<button type="button" wicket:id="add" class="dynamic-data-table-button dynamic-data-table-button-primary"><wicket:message key="addMember"/></button>
	</div>
	<div wicket:id="team">
		<table class="team-demo__table">
			<thead>
				<tr>
					<th scope="col"><wicket:message key="name"/></th>
					<th scope="col"><wicket:message key="email"/></th>
					<th scope="col"><wicket:message key="role"/></th>
					<th scope="col"><wicket:message key="actions"/></th>
				</tr>
			</thead>
			<tbody>
				<tr wicket:id="members">
					<td wicket:id="name" class="team-demo__name"></td>
					<td wicket:id="email"></td>
					<td wicket:id="role"></td>
					<td class="team-demo__actions">
						<button type="button" wicket:id="edit" class="dynamic-data-table-button"><wicket:message key="edit"/></button>
						<button type="button" wicket:id="delete" class="dynamic-data-table-button"><wicket:message key="delete"/></button>
					</td>
				</tr>
			</tbody>
		</table>
		<p wicket:id="empty" class="team-demo__empty"><wicket:message key="empty"/></p>
	</div>
</div>
<div wicket:id="dialog"></div>
<wicket:fragment wicket:id="formContent">
	<h1 class="modal-dialog-header" wicket:id="title"></h1>
	<div class="modal-dialog-body"><div wicket:id="form"></div></div>
</wicket:fragment>
<wicket:fragment wicket:id="deleteContent">
	<h1 class="modal-dialog-header"><wicket:message key="deleteMember"/></h1>
	<div class="modal-dialog-body">
		<p wicket:id="question"></p>
		<div class="member-form__buttons">
			<button type="button" wicket:id="cancel" class="dynamic-data-table-button"><wicket:message key="cancel"/></button>
			<button type="button" wicket:id="confirm" class="dynamic-data-table-button dynamic-data-table-button-primary"><wicket:message key="delete"/></button>
		</div>
	</div>
</wicket:fragment>
</wicket:extend>
</body>
</html>
