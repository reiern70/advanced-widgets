resize=Anpassbar
resize.NONE=nicht
resize.STRETCH=Tabelle w\u00e4chst mit
resize.help=Ob die Spalten durch Ziehen am rechten Rand einer \u00dcberschrift in der Breite ge\u00e4ndert werden k\u00f6nnen. Die Tabelle hat dann ein ResizableColumnsBehavior und w\u00e4chst mit der Spalte; die Spalten Auswahl, #, Aktionen und ID bleiben fest.
width=Breite
width.content=nach den Spalten
width.parent=volle Breite
width.help=Ob die Tabelle so breit wie ihre Spalten ist oder die volle Breite der Seite einnimmt und der Fenstergr\u00f6\u00dfe folgt, bis eine Spalte ge\u00e4ndert wird.
proportions=Verh\u00e4ltnisse
proportions.content=nach Inhalt
proportions.set=von der Seite vorgegeben
proportions.help=Ob sich die Spalten die Breite nach ihrem Inhalt oder nach von der Seite vorgegebenen Verh\u00e4ltnissen teilen.
navigation=Navigation
navigation.TOP=oben
navigation.BOTTOM=unten
navigation.BOTH=beide
navigation.help=Wo die Seitenlinks, die Zeilen pro Seite und die Aktionen f\u00fcr die ganze Tabelle stehen: \u00fcber den \u00dcberschriften, unter den Zeilen oder beides.
selectionBar=Position der Leiste f\u00fcr die Mehrfachauswahl
selectionBar.help=Wo die Leiste erscheint, die alle Benutzer auszuw\u00e4hlen anbietet, sobald alle Zeilen der Seite ausgew\u00e4hlt sind.
bodyHeightUnits=Einheit der H\u00f6he
bodyHeightUnits.PIXELS=Pixel
bodyHeightUnits.PERCENT=Prozent der H\u00f6he des Elternelements
bodyHeightUnits.VIEWPORT_HEIGHT=Prozent der Fensterh\u00f6he
bodyHeightUnits.help=Die Einheit der H\u00f6he des Tabellenk\u00f6rpers. Die Wahl setzt die H\u00f6he auf 800 Pixel oder auf 100 Prozent der H\u00f6he des Elternelements oder des Fensters. Bei Prozent des Elternelements ist dieses 600 Pixel hoch.
bodyHeight=H\u00f6he des Tabellenk\u00f6rpers (negativ: nach den Zeilen)
bodyHeight.help=Die H\u00f6he der Zeilen zwischen den \u00dcberschriften und dem Fu\u00df, in der Einheit dar\u00fcber. Nur die Zeilen rollen; eine negative H\u00f6he l\u00e4sst den K\u00f6rper so hoch wie seine Zeilen sein.
overlay=Formular und Best\u00e4tigung
overlay.LOCAL=\u00fcber der Tabelle
overlay.BODY=\u00fcber der Seite
overlay.help=Wo das Bearbeitungsformular und die L\u00f6schbest\u00e4tigung erscheinen: nur \u00fcber der Tabelle oder \u00fcber der ganzen Seite.
