columnState=Spaltenzustand
columnState.session=in der Sitzung
columnState.file=in einer Datei
columnState.help=Wo Reihenfolge, Sichtbarkeit und Breiten der Spalten gespeichert werden: in der Sitzung oder in einer Datei im tempor\u00e4ren Verzeichnis, die Neustarts des Servers \u00fcberdauert.
resetColumns=Spalten zur\u00fccksetzen
infiniteScroll=Endloses Scrollen
infiniteScroll.off=aus, seitenweise
infiniteScroll.on=an
infiniteScroll.help=Ob die Tabelle ihre Benutzer seitenweise zeigt oder in einer Liste, die um die nächsten 25 Benutzer wächst, sobald der Körper bis zu seinem Ende gerollt wird. Die Seitenlinks und die Zeilen pro Seite entfallen dann, und der Schleier sperrt die Tabelle, während die Benutzer geladen werden.
selection=Auswahl
selection.help=Wie viele Benutzer ausgew\u00e4hlt werden k\u00f6nnen: keine blendet die Auswahlspalte aus, eine l\u00e4sst nur eine Zeile ausgew\u00e4hlt, mehrere w\u00e4hlt beliebig viele Zeilen aus und bietet an, alle auszuw\u00e4hlen.
selection.NONE=keine
selection.ONE=eine Zeile
selection.MANY=mehrere Zeilen
