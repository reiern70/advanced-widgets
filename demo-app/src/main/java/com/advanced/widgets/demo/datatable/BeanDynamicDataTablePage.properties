title=BeanBasedDynamicDataTable Example
description=the same table with its rows rendered on the server
explanation=The same table as the JsonBasedDynamicDataTable example, a BeanBasedDynamicDataTable this time: its rows are rendered on the server by Wicket components, the way a DataTable renders them, and look and behave like the rows rendered in the browser from JSON.<br/> <ul> <li>The columns are Wicket's IColumns, here LambdaColumns. BeanSelectionColumn, BeanRowNumberColumn and BeanActionsColumn select, number and act on the rows; IFixedWidthColumn marks the columns that cannot be resized, IMovableColumn and IHideableColumn those the user can move and hide</li> <li>Paging, sorting, filtering, saving, adding and deleting render the rows again via Ajax, not the whole table, so the filter in front of the navigation keeps its focus</li> <li>The actions of a row are the same IconBasedRowActions as in the JSON example: plain markup whose clicks the table dispatches by the row's key, so a click on a user deleted in another tab still reaches the table</li> <li>The settings above are the same as in the JSON example, each explained by its (i). Every change is posted via Ajax</li> <li>"Add a user" adds Aaron and renders the rows again; there is no web socket connection and no pushing of rows here, and the progress bars show the progress the users had when the rows were rendered</li> </ul>
