title=Theme editor
description=generates a theme of the components, with a live preview
explanation=<p>The themes of the components are CSS classes setting the custom properties --wicket-theme-*, which the style sheets of the components read. Start from one of the themes, change its colors with the pickers of the ThemeEditorPanel on the left and watch the components on the right follow: progress bars, a collapsible panel, tabs with a TabsStyleBehavior and a modal dialog.</p><p>The text area below the pickers holds the CSS class defining your theme; put it into your style sheet and the classes wicket-theme and yours on a page or a component, and the components inside take its colors; wicket-theme marks the element as themed, as ThemeBehavior does for the built-in themes. The changes are made in the browser through the CSS object model, so the page needs no inline style and works under a strict Content Security Policy.</p>
base=Start from
openDialog=Open a dialog
collapsible.title=A collapsible panel
collapsible.body=Its title takes the theme's primary colors, like the headings of a table.
