title=Theme editor
description=generates a theme of the components, with a live preview
explanation=<p>The themes of the components are CSS classes setting the custom properties --wicket-theme-*, which the style sheets of the components read. The pickers of the ThemeEditorPanel start from the theme chosen for the page with the button at the bottom right; change a color and the components in the tabs below follow: progress bars, the JSON and the bean based tables, a collapsible panel, a floating panel, styled tabs and a modal dialog.</p><p>The text area holds the CSS class defining your theme; put it into your style sheet and the classes wicket-theme and yours on a page or a component, and the components inside take its colors. The changes are made in the browser through the CSS object model, so the page needs no inline style and works under a strict Content Security Policy.</p>
