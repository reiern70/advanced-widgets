<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed">
	<h3><wicket:message key="known"/></h3>
	<div wicket:id="bar"></div>
	<p><a href="#" wicket:id="toggle">[toggle]</a> | <a href="#" wicket:id="reset"><wicket:message key="reset"/></a></p>
	<h3><wicket:message key="unknown"/></h3>
	<div wicket:id="indeterminate"></div>
</div>
</wicket:extend>
</body>
</html>
