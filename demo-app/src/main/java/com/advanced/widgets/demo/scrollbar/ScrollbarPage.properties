title=Scrollbar
explanation=<p>A ScrollbarBehavior from ui-components gives a scrolling component scroll bars that look the same in every browser: the native ones are hidden and slim bars in the colors of the theme are drawn over the edges of the component. It keeps scrolling natively with the wheel, the keys and touch; the thumb can be dragged and a click on the track pages towards the click.</p><p>The first box keeps the browser's own scroll bar, to compare. The behavior draws the bars in the directions the CSS of the component lets it scroll, or in those given to it: the third box asks for the horizontal one only. The bars follow changes of the content: "Add 20 lines" re-renders the last box via Ajax and its bar picks up the new size. Change the theme with the button at the bottom right and the bars follow it.</p>
native=Browser scroll bar
vertical=Vertical
horizontal=Horizontal
both=Both ways
growing=Re-rendered via Ajax
addLines=Add 20 lines
