title=Progress Bar
description=a progress bar component updated via Ajax
explanation=<p>The ProgressBar component from ui-components shows a percentage as a native progress element, so it works under a strict Content Security Policy. Start advances it every 300 ms via an Ajax timer.</p><p>Its filled part is striped and the stripes move, unless your system asks for reduced motion. A bar whose model holds null is indeterminate: it tells that something is going on without knowing how far it got. The colors come from the theme chosen above, the same themes the DynamicDataTable uses.</p>
