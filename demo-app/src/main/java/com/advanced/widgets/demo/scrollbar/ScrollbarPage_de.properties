title=Bildlaufleiste
explanation=<p>Ein ScrollbarBehavior aus ui-components gibt einer rollenden Komponente Bildlaufleisten, die in jedem Browser gleich aussehen: die eigenen des Browsers werden ausgeblendet und schmale Leisten in den Farben des Farbschemas über ihre Ränder gezeichnet. Sie rollt weiter wie gewohnt mit Mausrad, Tasten und Touch; der Schieber lässt sich ziehen, und ein Klick auf die Leiste blättert in seine Richtung.</p><p>Das erste Feld behält die Leiste des Browsers zum Vergleich. Das Behavior zeichnet die Leisten in den Richtungen, in denen das CSS der Komponente sie rollen lässt, oder in den angegebenen: das dritte Feld verlangt nur die waagrechte. Die Leisten folgen dem Inhalt: „20 Zeilen hinzufügen“ zeichnet das letzte Feld per Ajax neu, und seine Leiste übernimmt die neue Größe.</p>
native=Leiste des Browsers
vertical=Senkrecht
horizontal=Waagrecht
both=Beide Richtungen
growing=Per Ajax neu gezeichnet
addLines=20 Zeilen hinzufügen
