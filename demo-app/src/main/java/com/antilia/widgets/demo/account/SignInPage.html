<wicket:extend xmlns:wicket="http://wicket.apache.org">
<main class="container register">
	<div class="register__card register__card--narrow">
		<h1><wicket:message key="title"/></h1>
		<p class="register__lead"><wicket:message key="lead"/></p>
		<div wicket:id="feedback"></div>
		<form wicket:id="form" class="register__form register__form--single" novalidate="novalidate">
			<label class="register__field register__field--wide"><span><wicket:message key="name"/></span> <input type="text" wicket:id="name" autocomplete="username"/></label>
			<label class="register__field register__field--wide"><span><wicket:message key="password"/></span> <input type="password" wicket:id="password" autocomplete="current-password"/></label>
			<p class="register__actions"><button type="submit" class="register__submit"><wicket:message key="submit"/></button></p>
		</form>
		<p class="register__hint"><wicket:message key="noAccount"/> <a wicket:id="registerInstead"><wicket:message key="register"/></a></p>
	</div>
</main>
</wicket:extend>
