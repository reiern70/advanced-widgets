<wicket:extend xmlns:wicket="http://wicket.apache.org">
<main class="container demo">
	<nav class="demo__nav">
		<a class="demo__back" wicket:id="back">&larr; <wicket:message key="backToHome"/></a>
		<span class="demo__steps">
			<a class="demo__step" wicket:id="previous">&lsaquo; <span wicket:id="name">[previous demo]</span></a>
			<a class="demo__step" wicket:id="next"><span wicket:id="name">[next demo]</span> &rsaquo;</a>
		</span>
	</nav>
	<div class="demo__heading">
		<h1 class="demo__title"><span wicket:id="demoTitle">[demo title]</span> <span class="badge" wicket:id="visibility">Public</span></h1>
		<button type="button" class="demo__about" wicket:id="about">
			<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
			<wicket:message key="aboutThisDemo"/>
		</button>
	</div>
	<div wicket:id="explanation">[what this demo shows, in a dialog]</div>
	<div wicket:id="frameworkTabs">[the Wicket, React and Svelte tabs]</div>
	<div id="framework-panel-wicket" class="framework-tabs__panel" data-framework-panel="wicket"><wicket:child/></div>
</main>
</wicket:extend>
