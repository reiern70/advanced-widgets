<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="tree-demo">
	<div class="tree-demo__options tree-demo__options--wide">
		<label wicket:for="icons"><wicket:message key="icons"/></label>
		<select wicket:id="icons"></select>
	</div>
	<section>
		<h2 class="tree-demo__title"><code>Tree</code> · <wicket:message key="section.wicket"/></h2>
		<div wicket:id="tree" class="tree-demo__box"></div>
	</section>
	<section>
		<h2 class="tree-demo__title"><code>JsonBasedTree</code> · <wicket:message key="section.json"/></h2>
		<div wicket:id="jsonTree" class="tree-demo__box"></div>
	</section>
	<aside class="tree-demo__details"><div wicket:id="details"></div></aside>
</div>
</wicket:extend>
</body>
</html>
