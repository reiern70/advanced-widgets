<wicket:panel xmlns:wicket="http://wicket.apache.org">
<section class="tree-demo-file" aria-live="polite">
	<h2 class="tree-demo-file__title"><wicket:message key="selectedFile"/></h2>
	<dl wicket:id="details" class="tree-demo-file__facts">
		<dt><wicket:message key="name"/></dt><dd wicket:id="name" class="tree-demo-file__name"></dd>
		<dt><wicket:message key="path"/></dt><dd wicket:id="path" class="tree-demo-file__path"></dd>
		<dt><wicket:message key="kind"/></dt><dd wicket:id="kind"></dd>
		<dt><wicket:message key="size"/></dt><dd wicket:id="size"></dd>
		<dt><wicket:message key="modified"/></dt><dd wicket:id="modified"></dd>
	</dl>
	<p wicket:id="none" class="tree-demo-file__none"><wicket:message key="noneSelected"/></p>
</section>
</wicket:panel>
