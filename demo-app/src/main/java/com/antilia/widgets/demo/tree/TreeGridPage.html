<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="tree-demo tree-demo--single">
	<div class="tree-demo__stack">
		<div class="tree-demo__options">
			<label wicket:for="resize"><wicket:message key="resize"/></label>
			<select wicket:id="resize"></select>
			<label wicket:for="icons"><wicket:message key="icons"/></label>
			<select wicket:id="icons"></select>
		</div>
		<section>
			<h2 class="tree-demo__title"><code>TreeGrid</code> · <wicket:message key="section.wicket"/></h2>
			<div wicket:id="treeGrid" class="tree-demo__box tree-demo__box--table"></div>
		</section>
		<section>
			<h2 class="tree-demo__title"><code>JsonBasedTreeGrid</code> · <wicket:message key="section.json"/></h2>
			<div wicket:id="jsonTreeGrid" class="tree-demo__box tree-demo__box--table"></div>
		</section>
	</div>
	<aside class="tree-demo__details"><div wicket:id="details"></div></aside>
</div>
</wicket:extend>
</body>
</html>
