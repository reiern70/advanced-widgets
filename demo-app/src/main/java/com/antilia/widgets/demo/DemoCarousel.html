<wicket:panel xmlns:wicket="http://wicket.apache.org">
	<div class="carousel" aria-roledescription="carousel" wicket:message="aria-label:carousel,data-label-pause:pause,data-label-play:play">
		<div class="carousel__viewport">
			<ul class="carousel__track">
				<li class="carousel__slide" role="group" aria-roledescription="slide" wicket:id="slides">
					<a class="carousel__shot" wicket:id="shot" tabindex="-1"><img wicket:id="image" src="images/demos/jsonTable.png" alt="" width="640" height="400"/></a>
					<div class="carousel__caption">
						<p class="carousel__head"><span class="carousel__category" wicket:id="category">Data</span> <span wicket:id="visibility">Private</span></p>
						<h3 class="carousel__name" wicket:id="name">JSON Grid</h3>
						<p class="carousel__description" wicket:id="description">What the demo shows</p>
						<p class="carousel__frameworks"><span class="framework">Wicket</span> <span class="framework" wicket:id="react">React</span> <span class="framework" wicket:id="svelte">Svelte</span></p>
						<p class="carousel__actions">
							<a class="carousel__open" wicket:id="open"><wicket:message key="open"/> &rarr;</a>
							<button type="button" class="carousel__details" wicket:id="details"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg> <wicket:message key="details"/></button>
						</p>
					</div>
				</li>
			</ul>
		</div>
		<div class="carousel__progress" aria-hidden="true"><span></span></div>
		<div class="carousel__controls">
			<button type="button" class="carousel__button" data-carousel="previous" wicket:message="aria-label:previous,title:previous">&lsaquo;</button>
			<span class="carousel__count" aria-live="polite" aria-atomic="true"></span>
			<button type="button" class="carousel__button" data-carousel="next" wicket:message="aria-label:next,title:next">&rsaquo;</button>
			<button type="button" class="carousel__button carousel__button--play" data-carousel="play" wicket:message="aria-label:pause,title:pause"><span aria-hidden="true">&#10074;&#10074;</span></button>
		</div>
	</div>
</wicket:panel>
