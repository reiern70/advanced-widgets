  The card of a user in the infinite list example: the template of the list's items, evaluated in
  the browser against the JSON of a user. A click on the card shows the user's details, the buttons
  edit and delete the user; all of them are handled by the list.
-->
<wicket:panel xmlns:wicket="http://wicket.apache.org"><div class="user-card" data-dt-action="details">
	<div class="user-card__avatar" aria-hidden="true">{{initials}}</div>
	<div class="user-card__main">
		<h3 class="user-card__name">{{firstName}} {{lastName}}</h3>
		<p class="user-card__meta">#{{@number}} · ID {{id}}</p>
		<p class="user-card__line">{{address}}, {{city}}, {{countryName}}</p>
		<dl class="user-card__facts">
			<dt>Mobiltelefon</dt><dd>{{cellPhone}}</dd>
			<dt>Geboren</dt><dd>{{born}}</dd>
		</dl>
		<div class="user-card__progress" title="Fortschritt"><div class="antilia-progress-bar"><progress class="antilia-progress-bar-value" max="100" value="{{progress}}">{{progress}}%</progress><span class="antilia-progress-bar-label" aria-hidden="true">{{progress}}%</span></div></div>
	</div>
	<div class="user-card__actions">
		<button type="button" class="user-card__button" data-dt-action="edit" title="Bearbeiten" aria-label="Bearbeiten"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5h4l11-11-4-4-11 11z M14 6l4 4"/></svg></button>
		<button type="button" class="user-card__button user-card__button--danger" data-dt-action="delete" title="Löschen" aria-label="Löschen"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13 M10 11v6 M14 11v6"/></svg></button>
	</div>
</div></wicket:panel>
