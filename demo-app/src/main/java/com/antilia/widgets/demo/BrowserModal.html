<wicket:panel xmlns:wicket="http://wicket.apache.org">
	<div wicket:id="overlay" class="modal-dialog-overlay">
		<div class="modal-dialog" role="dialog" aria-modal="true">
			<div class="modal-dialog-content">
				<div class="modal-dialog-header">
					<h1 wicket:id="title" class="modal-dialog-title">[title]</h1>
					<button wicket:id="close" type="button" class="modal-dialog-close">×</button>
				</div>
				<div class="antilia-scrollbar"><div wicket:id="body" class="modal-dialog-body">[body]</div></div>
				<div wicket:id="footer" class="modal-dialog-footer">[footer]</div>
			</div>
		</div>
	</div>
	<wicket:child/>
</wicket:panel>
