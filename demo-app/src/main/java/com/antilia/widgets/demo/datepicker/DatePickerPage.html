<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="datepicker-demo">
	<form wicket:id="form" class="datepicker-demo__form">
		<section>
			<h3><wicket:message key="dates"/></h3>
			<label class="datepicker-demo__field"><wicket:message key="born"/> <input type="text" wicket:id="born"/></label>
			<label class="datepicker-demo__field"><wicket:message key="start"/> <input type="text" wicket:id="start"/></label>
		</section>
		<section>
			<h3><wicket:message key="datesAndTimes"/></h3>
			<label class="datepicker-demo__field"><wicket:message key="appointment"/> <input type="text" wicket:id="appointment"/></label>
			<label class="datepicker-demo__field"><wicket:message key="departure"/> <input type="text" wicket:id="departure"/></label>
		</section>
		<section>
			<h3><wicket:message key="localeTitle"/></h3>
			<label class="datepicker-demo__field"><wicket:message key="calendarLocale"/> <select wicket:id="calendarLocale"></select></label>
			<label class="datepicker-demo__field"><wicket:message key="disabledTitle"/> <input type="text" wicket:id="disabled"/></label>
		</section>
		<p><button type="submit" class="datepicker-demo__send"><wicket:message key="send"/></button></p>
	</form>
	<p wicket:id="choices" class="datepicker-demo__choices">[choices]</p>
</div>
</wicket:extend>
</body>
</html>
