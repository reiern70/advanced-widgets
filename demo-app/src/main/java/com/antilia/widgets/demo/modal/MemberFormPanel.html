<wicket:panel xmlns:wicket="http://wicket.apache.org">
<form wicket:id="form" class="member-form">
	<div wicket:id="feedback"></div>
	<label><wicket:message key="name"/> <input type="text" wicket:id="name" autocomplete="name"/></label>
	<label><wicket:message key="email"/> <input type="email" wicket:id="email" autocomplete="email"/></label>
	<label><wicket:message key="role"/> <select wicket:id="role"></select></label>
</form>
</wicket:panel>
