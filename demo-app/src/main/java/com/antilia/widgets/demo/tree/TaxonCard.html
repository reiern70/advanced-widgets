<wicket:panel xmlns:wicket="http://wicket.apache.org">
<article wicket:id="card" class="tree-demo-card">
	<p wicket:id="rank" class="tree-demo-card__rank"></p>
	<h3 wicket:id="name" class="tree-demo-card__name"></h3>
	<p wicket:id="scientific" class="tree-demo-card__scientific"></p>
	<p wicket:id="description" class="tree-demo-card__description"></p>
	<dl class="tree-demo-card__facts">
		<dt><wicket:message key="period"/></dt><dd wicket:id="period"></dd>
		<dt><wicket:message key="lived"/></dt><dd wicket:id="lived"></dd>
	</dl>
</article>
</wicket:panel>
