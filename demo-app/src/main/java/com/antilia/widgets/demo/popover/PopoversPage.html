<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="popovers-demo">
	<section>
		<h3><wicket:message key="placementsTitle"/></h3>
		<p class="popovers-demo__text"><wicket:message key="placementsText"/></p>
		<form wicket:id="controls" class="popovers-demo__controls">
			<label class="popovers-demo__control"><wicket:message key="design"/> <select wicket:id="design"></select></label>
			<label class="popovers-demo__control"><wicket:message key="variant"/> <select wicket:id="variant"></select></label>
		</form>
		<div class="popovers-demo__compass">
			<div class="popovers-demo__target" aria-hidden="true"></div>
			<wicket:container wicket:id="placements"><button wicket:id="button">[placement]</button></wicket:container>
		</div>
	</section>
	<section>
		<h3><wicket:message key="galleryTitle"/></h3>
		<form wicket:id="galleryControls" class="popovers-demo__controls">
			<label class="popovers-demo__control"><wicket:message key="position"/> <select wicket:id="position"></select></label>
		</form>
		<div wicket:id="gallery" class="popovers-demo__gallery">
			<figure wicket:id="designs" class="popovers-demo__example">
				<div class="popovers-demo__stage">
					<div wicket:id="preview" class="antilia-popover" data-side="bottom" data-align="center">
						<div wicket:id="arrow" class="antilia-popover-arrow"></div>
						<div wicket:id="header" class="antilia-popover-header">
							<div wicket:id="title" class="antilia-popover-title">[design]</div>
							<span wicket:id="close" class="antilia-popover-close" aria-hidden="true"><svg viewBox="0 0 24 24" width="12" height="12" focusable="false"><path d="M6 6l12 12 M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
						</div>
						<div wicket:id="text" class="antilia-popover-body">[text]</div>
					</div>
				</div>
				<button wicket:id="try">[try]</button>
			</figure>
		</div>
	</section>
	<section>
		<h3><wicket:message key="richTitle"/></h3>
		<div class="popovers-demo__rich">
			<button wicket:id="status">[status]</button>
			<p class="popovers-demo__project"><wicket:message key="project"/> <strong wicket:id="project">[project]</strong> <button wicket:id="rename">[rename]</button></p>
		</div>
		<div wicket:id="statusContent">
			<dl class="popovers-demo__facts"><wicket:container wicket:id="facts"><dt wicket:id="name">[name]</dt><dd wicket:id="value">[value]</dd></wicket:container></dl>
		</div>
		<div wicket:id="renameContent">
			<form wicket:id="renameForm" class="popovers-demo__rename">
				<label class="popovers-demo__rename-field"><wicket:message key="name"/> <input type="text" wicket:id="name" autofocus="autofocus"/></label>
				<p wicket:id="error" class="popovers-demo__error" role="alert">[error]</p>
				<div class="popovers-demo__actions"><button type="submit" wicket:id="save"><wicket:message key="save"/></button><button wicket:id="cancel">[cancel]</button></div>
			</form>
		</div>
	</section>
	<section class="popovers-demo__pair">
		<div>
			<h3><wicket:message key="fieldsTitle"/></h3>
			<form wicket:id="fields" class="popovers-demo__fields">
				<div wicket:id="field" class="popovers-demo__field">
					<div class="popovers-demo__label"><label wicket:id="label">[label]</label><button wicket:id="help">[help]</button></div>
					<input type="text" wicket:id="input" class="popovers-demo__input"/>
				</div>
			</form>
		</div>
		<div>
			<h3><wicket:message key="tableTitle"/></h3>
			<div class="popovers-demo__scroll">
				<table class="popovers-demo__table">
					<thead><tr><th scope="col"><wicket:message key="country"/></th><th scope="col"><wicket:message key="language"/></th><th scope="col"><wicket:message key="currency"/></th><th scope="col"></th></tr></thead>
					<tbody>
						<tr wicket:id="countries"><td wicket:id="name">[name]</td><td wicket:id="language">[language]</td><td wicket:id="currency">[currency]</td><td class="popovers-demo__action"><button wicket:id="about">[about]</button></td></tr>
					</tbody>
				</table>
			</div>
		</div>
	</section>
</div>
</wicket:extend>
</body>
</html>
