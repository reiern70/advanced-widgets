<wicket:panel xmlns:wicket="http://wicket.apache.org">
<form wicket:id="form" class="user-edit">
	<div wicket:id="feedback"></div>
	<label><wicket:message key="field.firstName"/> <input type="text" wicket:id="firstName" autocomplete="given-name"/></label>
	<label><wicket:message key="field.lastName"/> <input type="text" wicket:id="lastName" autocomplete="family-name"/></label>
	<label><wicket:message key="field.country"/> <select wicket:id="country" autocomplete="country"></select></label>
	<label><wicket:message key="field.city"/> <input type="text" wicket:id="city" autocomplete="address-level2"/></label>
	<label><wicket:message key="field.address"/> <input type="text" wicket:id="address" autocomplete="street-address"/></label>
	<div class="ant-button-bar ant-data-table-overlay-buttons">
		<button type="button" wicket:id="cancel"><wicket:message key="cancel"/></button>
		<button type="submit" wicket:id="save"><wicket:message key="save"/></button>
	</div>
</form>
</wicket:panel>
