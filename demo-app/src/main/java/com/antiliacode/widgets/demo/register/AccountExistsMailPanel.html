<wicket:panel xmlns:wicket="http://wicket.apache.org">
<div style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.5; color: #1f2933; max-width: 560px; margin: 0 auto; padding: 24px;">
	<h1 style="font-size: 22px; margin: 0 0 16px; color: #1f2933;"><wicket:message key="title"/></h1>
	<p><wicket:message key="greeting"/></p>
	<p><wicket:message key="tried"/></p>
	<p><wicket:message key="signIn"/></p>
	<p style="margin: 24px 0;"><a wicket:id="button" style="display: inline-block; padding: 12px 22px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold;"><wicket:message key="button"/></a></p>
	<p style="font-size: 13px; color: #52606d;"><wicket:message key="orCopy"/><br/><a wicket:id="link" style="color: #2563eb; word-break: break-all;">[https://example.com/sign-in]</a></p>
	<p><wicket:message key="notConfirmed"/></p>
	<p style="font-size: 13px; color: #52606d;"><wicket:message key="ignore"/></p>
	<p style="margin-top: 24px;">Antilia Widgets</p>
</div>
</wicket:panel>
