<wicket:panel xmlns:wicket="http://wicket.apache.org">
<div wicket:id="wizard"></div>

<wicket:fragment wicket:id="upload">
	<p class="wizard-demo__hint"><wicket:message key="uploadHint"/></p>
	<input type="file" wicket:id="file" accept="image/png,image/jpeg,image/gif,image/webp"/>
	<p wicket:id="current" class="wizard-demo__hint">[current]</p>
</wicket:fragment>

<wicket:fragment wicket:id="way">
	<div class="wizard-demo__way">
		<img wicket:id="thumbnail" class="wizard-demo__thumbnail"/>
		<fieldset class="wizard-demo__couplet">
			<legend class="wizard-demo__question"><wicket:message key="wayLabel"/></legend>
			<div wicket:id="choice" class="wizard-demo__answers"></div>
		</fieldset>
	</div>
</wicket:fragment>

<wicket:fragment wicket:id="describe">
	<label class="wizard-demo__field"><wicket:message key="description"/>
		<textarea wicket:id="description" rows="4" maxlength="500"></textarea></label>
</wicket:fragment>

<wicket:fragment wicket:id="caption">
	<label class="wizard-demo__field"><wicket:message key="captionLabel"/>
		<input type="text" wicket:id="text" maxlength="80"/></label>
	<fieldset class="wizard-demo__couplet">
		<legend class="wizard-demo__question"><wicket:message key="position"/></legend>
		<div wicket:id="position" class="wizard-demo__answers"></div>
	</fieldset>
</wicket:fragment>

<wicket:fragment wicket:id="preview">
	<figure class="wizard-demo__card">
		<div class="wizard-demo__frame">
			<img wicket:id="image" class="wizard-demo__image"/>
			<p wicket:id="text" class="wizard-demo__text">[text]</p>
		</div>
		<figcaption wicket:id="description" class="wizard-demo__description">[description]</figcaption>
	</figure>
</wicket:fragment>
</wicket:panel>
