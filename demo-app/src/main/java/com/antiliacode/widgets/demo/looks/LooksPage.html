<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<p class="looks__intro"><wicket:message key="intro"/></p>
<nav class="looks__frameworks" wicket:message="aria-label:frameworks">
	<a class="looks__framework" wicket:id="bootstrapLink">Bootstrap</a>
	<a class="looks__framework" wicket:id="daisyuiLink">daisyUI</a>
</nav>
<div class="looks">
	<section class="looks__column" wicket:id="antilia">
		<h2 class="looks__title"><wicket:message key="antilia"/></h2>
		<p class="looks__help"><wicket:message key="antilia.help"/></p>
		<div wicket:id="sample"></div>
	</section>
	<section class="looks__column" wicket:id="framework">
		<h2 class="looks__title" wicket:id="title"></h2>
		<p class="looks__help" wicket:id="help"></p>
		<div wicket:id="sample"></div>
	</section>
	<section class="looks__column" wicket:id="mixed">
		<h2 class="looks__title" wicket:id="title"></h2>
		<p class="looks__help" wicket:id="help"></p>
		<div wicket:id="sample"></div>
	</section>
	<section class="looks__column looks__native" wicket:id="native">
		<h2 class="looks__title" wicket:id="title"></h2>
		<p class="looks__help" wicket:id="help"></p>
		<div wicket:id="markup"></div>
	</section>
</div>
<wicket:fragment wicket:id="bootstrap">
	<div class="looks__group">
		<div class="alert alert-primary" role="alert"><wicket:message key="native.alert"/></div>
	</div>
	<div class="looks__group">
		<div class="btn-group" role="group" wicket:message="aria-label:native.view">
			<button type="button" class="btn btn-primary"><wicket:message key="native.day"/></button>
			<button type="button" class="btn btn-secondary"><wicket:message key="native.week"/></button>
			<button type="button" class="btn btn-secondary"><wicket:message key="native.month"/></button>
		</div>
	</div>
	<div class="looks__group">
		<label class="form-label" for="looks-native-email"><wicket:message key="native.email"/></label>
		<input type="email" class="form-control" id="looks-native-email" placeholder="you@example.com"/>
		<div class="form-check mt-2">
			<input class="form-check-input" type="checkbox" id="looks-native-check" checked="checked"/>
			<label class="form-check-label" for="looks-native-check"><wicket:message key="native.remember"/></label>
		</div>
	</div>
	<div class="looks__group">
		<ul class="nav nav-tabs">
			<li class="nav-item"><a class="nav-link active" aria-current="page" href="#"><wicket:message key="native.overview"/></a></li>
			<li class="nav-item"><a class="nav-link" href="#"><wicket:message key="native.details"/></a></li>
		</ul>
	</div>
	<div class="looks__group">
		<div class="card">
			<div class="card-header"><wicket:message key="native.card"/></div>
			<ul class="list-group list-group-flush">
				<li class="list-group-item active"><wicket:message key="native.first"/></li>
				<li class="list-group-item"><wicket:message key="native.second"/></li>
			</ul>
		</div>
	</div>
	<div class="looks__group">
		<div class="progress" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" wicket:message="aria-label:progress"><div class="progress-bar looks__native-progress"></div></div>
	</div>
</wicket:fragment>
<wicket:fragment wicket:id="daisyui">
	<div class="looks__group">
		<div class="alert alert-info" role="alert"><span><wicket:message key="daisyui.native.alert"/></span></div>
	</div>
	<div class="looks__group">
		<div class="join" role="group" wicket:message="aria-label:native.view">
			<button type="button" class="btn btn-primary join-item"><wicket:message key="native.day"/></button>
			<button type="button" class="btn join-item"><wicket:message key="native.week"/></button>
			<button type="button" class="btn join-item"><wicket:message key="native.month"/></button>
		</div>
	</div>
	<div class="looks__group">
		<fieldset class="fieldset">
			<legend class="fieldset-legend"><wicket:message key="native.email"/></legend>
			<input type="email" class="input" id="looks-daisyui-email" placeholder="you@example.com" wicket:message="aria-label:native.email"/>
			<label class="label"><input class="checkbox checkbox-primary" type="checkbox" checked="checked"/> <wicket:message key="native.remember"/></label>
		</fieldset>
	</div>
	<div class="looks__group">
		<div class="tabs tabs-lift" role="tablist">
			<a class="tab tab-active" role="tab" aria-selected="true" href="#"><wicket:message key="native.overview"/></a>
			<a class="tab" role="tab" aria-selected="false" href="#"><wicket:message key="native.details"/></a>
		</div>
	</div>
	<div class="looks__group">
		<div class="card card-border bg-base-100">
			<div class="card-body">
				<h3 class="card-title"><wicket:message key="native.card"/></h3>
				<ul class="menu looks__native-menu">
					<li><a class="menu-active" href="#"><wicket:message key="native.first"/></a></li>
					<li><a href="#"><wicket:message key="native.second"/></a></li>
				</ul>
			</div>
		</div>
	</div>
	<div class="looks__group">
		<progress class="progress progress-primary" value="62" max="100" wicket:message="aria-label:progress"></progress>
	</div>
</wicket:fragment>
</wicket:extend>
</body>
</html>
