<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="resumable-demo">
	<section class="resumable-demo__case">
		<p class="resumable-demo__hint"><wicket:message key="hint"/></p>
		<div class="resumable-demo__uploads"><input type="file" wicket:id="uploads"/></div>
		<p wicket:id="limits" class="resumable-demo__hint">[limits]</p>
	</section>
	<section class="resumable-demo__settings">
		<label class="resumable-demo__check"><input type="checkbox" wicket:id="breaking"/> <wicket:message key="breaking"/></label>
		<div wicket:id="speed">[the speed of the uploads]</div>
	</section>
	<section wicket:id="received" class="resumable-demo__received">
		<h3><wicket:message key="received"/></h3>
		<table wicket:id="table" class="resumable-demo__table">
			<thead>
				<tr>
					<th><wicket:message key="received.name"/></th>
					<th><wicket:message key="received.size"/></th>
					<th><wicket:message key="received.sha256"/></th>
				</tr>
			</thead>
			<tbody>
				<tr wicket:id="files">
					<td wicket:id="name">[name]</td>
					<td wicket:id="size" class="resumable-demo__number">[size]</td>
					<td wicket:id="sha256" class="resumable-demo__digest">[SHA-256]</td>
				</tr>
			</tbody>
		</table>
		<p wicket:id="none" class="resumable-demo__hint"><wicket:message key="received.none"/></p>
	</section>
</div>
</wicket:extend>
</body>
</html>
