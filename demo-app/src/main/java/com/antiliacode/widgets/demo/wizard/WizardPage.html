<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="wizard-demo">
	<form wicket:id="settings" class="wizard-demo__controls">
		<label class="wizard-demo__control"><wicket:message key="buttonsPosition"/> <select wicket:id="buttonsPosition"></select></label>
		<label class="wizard-demo__control"><wicket:message key="breadcrumbPosition"/> <select wicket:id="breadcrumbPosition"></select></label>
	</form>
	<div class="wizard-demo__cases">
		<section class="wizard-demo__case">
			<h3 class="wizard-demo__heading"><wicket:message key="keyTitle"/></h3>
			<p class="wizard-demo__intro"><wicket:message key="keyIntro"/></p>
			<div wicket:id="key"></div>
		</section>
		<section class="wizard-demo__case">
			<h3 class="wizard-demo__heading"><wicket:message key="cardTitle"/></h3>
			<p class="wizard-demo__intro"><wicket:message key="cardIntro"/></p>
			<div wicket:id="card"></div>
		</section>
	</div>
</div>
</wicket:extend>
</body>
</html>
