<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="upload-demo">
	<div wicket:id="speed">[the speed of the uploads]</div>
	<div wicket:id="cases">[the cases, as pills]</div>
	<section wicket:id="received" class="upload-demo__received">
		<h3><wicket:message key="received"/></h3>
		<table wicket:id="table" class="upload-demo__table">
			<thead>
				<tr>
					<th><wicket:message key="received.name"/></th>
					<th><wicket:message key="received.size"/></th>
					<th><wicket:message key="received.type"/></th>
					<th><wicket:message key="received.way"/></th>
				</tr>
			</thead>
			<tbody>
				<tr wicket:id="files">
					<td wicket:id="name">[name]</td>
					<td wicket:id="size" class="upload-demo__number">[size]</td>
					<td wicket:id="type">[type]</td>
					<td wicket:id="way">[way]</td>
				</tr>
			</tbody>
		</table>
		<p wicket:id="none" class="upload-demo__hint"><wicket:message key="received.none"/></p>
	</section>
</div>
<wicket:fragment wicket:id="formCase">
	<section class="upload-demo__case">
		<p class="upload-demo__hint"><wicket:message key="form.hint"/></p>
		<form wicket:id="form" class="upload-demo__form">
			<div class="upload-demo__field">
				<label wicket:for="description"><wicket:message key="description"/></label>
				<input type="text" wicket:id="description" class="upload-demo__text"/>
			</div>
			<div class="upload-demo__field">
				<label wicket:for="files"><wicket:message key="files"/></label>
				<input type="file" wicket:id="files"/>
				<p wicket:id="selection" class="upload-demo__selection">[what the browser told]</p>
				<p wicket:id="limits" class="upload-demo__hint">[limits]</p>
				<label class="upload-demo__check"><input type="checkbox" wicket:id="several"/> <wicket:message key="several"/></label>
			</div>
			<div wicket:id="progress"></div>
			<div class="ant-button-bar">
				<button type="submit" wicket:id="submit"><wicket:message key="form.submit"/></button>
				<button type="submit" wicket:id="ajaxSubmit"><wicket:message key="form.ajaxSubmit"/></button>
			</div>
		</form>
	</section>
</wicket:fragment>
<wicket:fragment wicket:id="dropCase">
	<section class="upload-demo__case">
		<h3><wicket:message key="drop.form"/></h3>
		<p class="upload-demo__hint"><wicket:message key="drop.form.hint"/></p>
		<label class="upload-demo__check"><input type="checkbox" wicket:id="severalImages"/> <wicket:message key="several"/></label>
		<form wicket:id="dropForm" class="upload-demo__form">
			<input type="file" wicket:id="images" accept="image/*"/>
			<div wicket:id="dropFormProgress"></div>
			<div class="ant-button-bar">
				<button type="submit" wicket:id="send"><wicket:message key="drop.send"/></button>
			</div>
		</form>
	</section>
</wicket:fragment>
</wicket:extend>
</body>
</html>
