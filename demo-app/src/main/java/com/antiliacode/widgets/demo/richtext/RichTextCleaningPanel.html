<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
	<h3 class="rich-text-demo__subtitle"><wicket:message key="title"/></h3>
	<p class="rich-text-demo__status"><wicket:message key="explanation"/></p>
	<form wicket:id="form" class="rich-text-demo__editor">
		<div class="rich-text-demo__controls">
			<fieldset class="rich-text-demo__control">
				<legend><wicket:message key="cleaningLegend"/></legend>
				<span wicket:id="cleaning">[silent, report or reject]</span>
			</fieldset>
			<label class="rich-text-demo__control"><input type="checkbox" wicket:id="pasteNotice"/> <wicket:message key="pasteNotice"/></label>
		</div>
		<label wicket:for="editor" class="rich-text-demo__name"><wicket:message key="pasteLabel"/></label>
		<textarea wicket:id="editor"></textarea>
		<div class="rich-text-demo__actions">
			<button type="submit" wicket:id="send"><wicket:message key="send"/></button>
			<button type="submit" wicket:id="sendUnsafe"><wicket:message key="sendUnsafe"/></button>
		</div>
	</form>
	<div wicket:id="kept" class="rich-text-demo__saved">
		<h3 class="rich-text-demo__subtitle"><wicket:message key="kept"/></h3>
		<pre><code wicket:id="html">[the HTML the server kept]</code></pre>
	</div>
</wicket:panel>
</body>
</html>
