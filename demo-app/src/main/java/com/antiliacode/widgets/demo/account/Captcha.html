<wicket:panel xmlns:wicket="http://wicket.apache.org">
	<p wicket:id="lead" class="register__captcha-lead"></p>
	<p wicket:id="pictured" class="register__captcha-image"><img wicket:id="image" alt="" width="240" height="80" wicket:message="alt:captchaImage"/> <a wicket:id="another"><wicket:message key="captchaAnother"/></a></p>
	<label class="register__field register__field--wide"><span wicket:id="label"></span> <input type="text" wicket:id="answer" autocomplete="off" spellcheck="false"/></label>
	<p class="register__captcha-other"><a wicket:id="other"><span wicket:id="label"></span></a></p>
</wicket:panel>
