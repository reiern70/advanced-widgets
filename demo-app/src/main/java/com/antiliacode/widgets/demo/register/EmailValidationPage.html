<wicket:extend xmlns:wicket="http://wicket.apache.org">
<main class="container register">
	<div wicket:id="confirm" class="register__card register__card--done">
		<svg class="register__mail" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
		<h1><wicket:message key="confirm.title"/></h1>
		<p wicket:id="text">[Press the button to confirm ada@example.com]</p>
		<form wicket:id="form"><p><button type="submit" class="register__submit"><wicket:message key="confirm.button"/></button></p></form>
	</div>
	<div wicket:id="validated" class="register__card register__card--done">
		<svg class="register__mail" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true" focusable="false"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
		<h1><wicket:message key="validated.title"/></h1>
		<p wicket:id="email">[ada@example.com is confirmed]</p>
		<p><a wicket:id="signIn" class="register__submit"><wicket:message key="toSignIn"/></a></p>
	</div>
	<div wicket:id="invalid" class="register__card register__card--done">
		<h1><wicket:message key="invalid.title"/></h1>
		<p><wicket:message key="invalid.text"/></p>
		<p><a wicket:id="signIn"><wicket:message key="toSignIn"/></a> · <a wicket:id="home"><wicket:message key="home"/></a></p>
	</div>
</main>
</wicket:extend>
