<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:panel>
	<form wicket:id="writingControls" class="rich-text-demo__controls">
		<label class="rich-text-demo__control"><wicket:message key="spellcheck"/> <select wicket:id="spellcheck"></select></label>
		<label class="rich-text-demo__control"><wicket:message key="textLanguage"/> <select wicket:id="textLanguage"></select></label>
		<label class="rich-text-demo__control"><wicket:message key="proofreading"/> <select wicket:id="proofreading"></select></label>
	</form>
	<p class="rich-text-demo__status"><wicket:message key="writingExplanation"/></p>
	<form wicket:id="writingForm" class="rich-text-demo__editor">
		<label wicket:id="writingName" class="rich-text-demo__name">[text]</label>
		<textarea wicket:id="editor"></textarea>
		<div class="rich-text-demo__actions">
			<button type="submit" wicket:id="save"><wicket:message key="save"/></button>
			<span wicket:id="writingStatus" class="rich-text-demo__heard" role="status">[status]</span>
		</div>
	</form>
	<div wicket:id="writingKept" class="rich-text-demo__saved">
		<h3 class="rich-text-demo__subtitle"><wicket:message key="asTyped"/></h3>
		<div wicket:id="view" class="rich-text-demo__view"></div>
		<p wicket:id="mentions" class="rich-text-demo__status">[the mentions the server reads]</p>
	</div>
</wicket:panel>
</body>
</html>
