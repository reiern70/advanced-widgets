<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="rich-text-demo">
	<div wicket:id="cases">[the cases, as pills]</div>
</div>

<wicket:fragment wicket:id="articleCase">
	<section>
		<form wicket:id="controls" class="rich-text-demo__controls">
			<label class="rich-text-demo__control"><wicket:message key="toolbar"/> <select wicket:id="toolbar"></select></label>
			<label class="rich-text-demo__control"><input type="checkbox" wicket:id="bubbleMenu"/> <wicket:message key="bubbleMenu"/></label>
			<label class="rich-text-demo__control"><input type="checkbox" wicket:id="readOnly"/> <wicket:message key="readOnly"/></label>
			<label class="rich-text-demo__control"><input type="checkbox" wicket:id="count"/> <wicket:message key="count"/></label>
			<label class="rich-text-demo__control"><input type="checkbox" wicket:id="highlight"/> <wicket:message key="highlight"/></label>
		</form>
		<p wicket:id="extras" class="rich-text-demo__status">[the languages of the code blocks and the uploads]</p>
		<form wicket:id="editorForm" class="rich-text-demo__editor">
			<label wicket:id="articleName" class="rich-text-demo__name">[article]</label>
			<textarea wicket:id="editor"></textarea>
			<div class="rich-text-demo__actions">
				<button type="submit" wicket:id="save"><wicket:message key="save"/></button>
				<span wicket:id="heard" class="rich-text-demo__heard" role="status">[what the server heard]</span>
			</div>
		</form>
		<p wicket:id="known" class="rich-text-demo__status">[what the server knows]</p>
		<div wicket:id="saved" class="rich-text-demo__saved">
			<h3 class="rich-text-demo__subtitle"><wicket:message key="asShown"/></h3>
			<div wicket:id="view" class="rich-text-demo__view"></div>
			<details class="rich-text-demo__source">
				<summary><wicket:message key="htmlKept"/></summary>
				<pre><code wicket:id="html">[the HTML the server keeps]</code></pre>
			</details>
		</div>
	</section>
</wicket:fragment>

<wicket:fragment wicket:id="notesCase">
	<section>
		<form wicket:id="notesForm" class="rich-text-demo__editor">
			<label wicket:id="notesName" class="rich-text-demo__name">[notes]</label>
			<textarea wicket:id="editor"></textarea>
			<div class="rich-text-demo__actions">
				<button type="submit" wicket:id="save"><wicket:message key="save"/></button>
				<span wicket:id="notesStatus" class="rich-text-demo__heard" role="status">[status]</span>
			</div>
		</form>
		<div wicket:id="kept" class="rich-text-demo__saved">
			<h3 class="rich-text-demo__subtitle"><wicket:message key="markdownKept"/></h3>
			<pre class="rich-text-demo__markdown"><code wicket:id="markdown">[the Markdown the server keeps]</code></pre>
		</div>
	</section>
</wicket:fragment>

<wicket:fragment wicket:id="cleaningCase">
	<section>
		<p class="rich-text-demo__status"><wicket:message key="cleaningExplanation"/></p>
		<form wicket:id="cleaningForm" class="rich-text-demo__editor">
			<label for="rich-text-demo-unsafe" class="rich-text-demo__name"><wicket:message key="unsafeLabel"/></label>
			<textarea wicket:id="unsafe" id="rich-text-demo-unsafe" class="rich-text-demo__unsafe" rows="12" spellcheck="false"></textarea>
			<div class="rich-text-demo__actions">
				<button type="submit" wicket:id="clean"><wicket:message key="clean"/></button>
			</div>
		</form>
		<div wicket:id="cleaned" class="rich-text-demo__saved">
			<h3 class="rich-text-demo__subtitle"><wicket:message key="cleanedHtml"/></h3>
			<pre><code wicket:id="html">[the HTML cleaned]</code></pre>
			<h3 class="rich-text-demo__subtitle"><wicket:message key="asShown"/></h3>
			<div wicket:id="view" class="rich-text-demo__view"></div>
		</div>
	</section>
</wicket:fragment>
</wicket:extend>
</body>
</html>
