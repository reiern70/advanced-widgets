<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
<div wicket:id="themed" class="tabs-demo">
	<div wicket:id="cases">[the cases, as pills]</div>
</div>

<wicket:fragment wicket:id="documentsCase">
	<section>
		<div class="tabs-demo__heading">
			<a wicket:id="newDocument" href="#" class="tabs-demo__new"><wicket:message key="newDocument"/></a>
		</div>
		<div wicket:id="documents" class="tabs-demo__documents"></div>
		<p wicket:id="status" class="tabs-demo__status" role="status">[status]</p>
	</section>
</wicket:fragment>

<wicket:fragment wicket:id="settingsCase">
	<section>
		<form wicket:id="form" class="tabs-demo__controls">
			<label class="tabs-demo__control"><input type="checkbox" wicket:id="vertical"/> <wicket:message key="vertical"/></label>
			<label class="tabs-demo__control"><wicket:message key="design"/> <select wicket:id="design"></select></label>
		</form>
		<div wicket:id="settings" class="tabs-demo__settings"></div>
		<p wicket:id="selected" class="tabs-demo__status">[selected]</p>
	</section>
</wicket:fragment>

<wicket:fragment wicket:id="galleryCase">
	<section>
		<h4 class="tabs-demo__group"><wicket:message key="alongTheTop"/></h4>
		<div class="tabs-demo__gallery tabs-demo__gallery--top">
			<figure wicket:id="topDesigns" class="tabs-demo__example"><figcaption wicket:id="name">[design]</figcaption><div wicket:id="tabs"></div></figure>
		</div>
		<h4 class="tabs-demo__group"><wicket:message key="downTheSide"/></h4>
		<div class="tabs-demo__gallery tabs-demo__gallery--side">
			<figure wicket:id="sideDesigns" class="tabs-demo__example"><figcaption wicket:id="name">[design]</figcaption><div wicket:id="tabs"></div></figure>
		</div>
	</section>
</wicket:fragment>

<wicket:fragment wicket:id="welcomePanel"><p class="tabs-demo__text"><wicket:message key="welcomeText"/></p></wicket:fragment>

<wicket:fragment wicket:id="documentPanel">
<form wicket:id="form" class="tabs-demo__document">
	<textarea wicket:id="text" class="tabs-demo__editor" rows="6"></textarea>
	<div><button type="submit" wicket:id="save"><wicket:message key="save"/></button></div>
</form>
</wicket:fragment>
</wicket:extend>
</body>
</html>
