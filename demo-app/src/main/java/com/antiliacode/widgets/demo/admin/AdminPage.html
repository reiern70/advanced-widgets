<wicket:extend xmlns:wicket="http://wicket.apache.org">
<main class="container admin">
	<h1><wicket:message key="title"/></h1>
	<p wicket:id="lead" class="admin__lead">[3 of 10 sessions are signed in as user.]</p>
	<table wicket:id="table" class="admin__sessions">
		<thead>
			<tr><th>#</th><th><wicket:message key="since"/></th><th><wicket:message key="seen"/></th><th><wicket:message key="sureUntil"/></th></tr>
		</thead>
		<tbody>
			<tr wicket:id="places"><td wicket:id="number">1</td><td wicket:id="since">[since]</td><td wicket:id="seen">[seen]</td><td wicket:id="sureUntil">[sure until]</td></tr>
		</tbody>
	</table>
	<h2><wicket:message key="visitsTitle"/></h2>
	<p wicket:id="visitsLead" class="admin__lead">[12 people opened a page or signed in in the last 30 days.]</p>
	<p class="admin__lead"><span wicket:id="visitsKept">[Counted since 2026-11-27.]</span> <a wicket:id="json" href="#"><wicket:message key="json"/></a></p>
	<table wicket:id="pagesTable" class="admin__sessions">
		<thead>
			<tr><th><wicket:message key="page"/></th><th><wicket:message key="views"/></th><th><wicket:message key="people"/></th></tr>
		</thead>
		<tbody>
			<tr wicket:id="pages"><td wicket:id="page">/</td><td wicket:id="views">1</td><td wicket:id="people">1</td></tr>
		</tbody>
	</table>
	<table wicket:id="daysTable" class="admin__sessions">
		<thead>
			<tr><th><wicket:message key="date"/></th><th><wicket:message key="people"/></th><th><wicket:message key="newPeople"/></th><th><wicket:message key="signedInPeople"/></th><th><wicket:message key="signIns"/></th><th><wicket:message key="views"/></th></tr>
		</thead>
		<tbody>
			<tr wicket:id="days"><td wicket:id="date">2026-11-27</td><td wicket:id="people">1</td><td wicket:id="newPeople">1</td><td wicket:id="signedInPeople">1</td><td wicket:id="signIns">1</td><td wicket:id="views">1</td></tr>
		</tbody>
	</table>
	<div wicket:id="visitorsTable">
		<h2><wicket:message key="visitorsTitle"/></h2>
		<p wicket:id="visitorsLead" class="admin__lead">[Each one a browser.]</p>
		<table class="admin__sessions">
			<thead>
				<tr><th><wicket:message key="visitor"/></th><th><wicket:message key="firstSeen"/></th><th><wicket:message key="lastSeen"/></th><th><wicket:message key="activeDays"/></th><th><wicket:message key="views"/></th><th><wicket:message key="signIns"/></th><th><wicket:message key="pagesOpened"/></th></tr>
			</thead>
			<tbody>
				<tr wicket:id="visitors"><td wicket:id="visitor">a1b2c3d4</td><td wicket:id="firstSeen">[first]</td><td wicket:id="lastSeen">[last]</td><td wicket:id="days">1</td><td wicket:id="views">2</td><td wicket:id="signIns">0</td><td wicket:id="pages" class="admin__pages">/ 2</td></tr>
			</tbody>
		</table>
	</div>
</main>
</wicket:extend>
