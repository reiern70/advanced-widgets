<wicket:panel xmlns:wicket="http://wicket.apache.org">
<div wicket:id="frame" class="antilia-collapsible-frame">
	<details wicket:id="details" class="antilia-collapsible">
		<summary wicket:id="title" class="antilia-collapsible-title">[title]</summary>
		<div wicket:id="bodyFrame" class="antilia-collapsible-body"><wicket:container wicket:id="body">[body]</wicket:container></div>
	</details>
	<div wicket:id="actions" class="antilia-collapsible-actions"><button type="button" wicket:id="action"></button></div>
</div>
</wicket:panel>
