<wicket:panel xmlns:wicket="http://wicket.apache.org">
	<div wicket:id="header" class="modal-dialog-header">
		<h1 wicket:id="title" class="modal-dialog-title"></h1>
		<button wicket:id="close" type="button" class="modal-dialog-close">×</button>
	</div>
	<div wicket:id="scroller" class="antilia-scrollbar"><div wicket:id="body" class="modal-dialog-body"></div></div>
	<div wicket:id="footer" class="modal-dialog-footer">
		<button wicket:id="buttons" type="button"></button>
	</div>
</wicket:panel>
