<wicket:panel xmlns:wicket="http://wicket.apache.org">
<td wicket:id="span"><div class="dynamic-data-table-navigation">
	<div class="dynamic-data-table-navigation-prefix" wicket:id="prefix"></div>
	<div class="dynamic-data-table-paging" wicket:id="paging">
		<div class="navigatorLabel"><div wicket:id="navigatorLabel">[navigator-label]</div></div>
		<div class="navigator"><div wicket:id="navigator">[navigator]</div></div>
	</div>
	<div class="dynamic-data-table-actions" wicket:id="actionsContainer"><span wicket:id="actions"></span></div>
	<label class="dynamic-data-table-page-size" wicket:id="pageSize"><span wicket:id="label">[rows per page]</span> <select wicket:id="itemsPerPage"></select></label>
</div></td>
</wicket:panel>
