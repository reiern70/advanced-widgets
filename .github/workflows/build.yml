# Builds and tests every push to master and every pull request, as mvn verify does on a developer's
# machine: the Java modules with their tests, and the frontend with its own, which the Maven build
# runs with the Node it installs.
#
# The project depends on Wicket 11.0.0, which the pom takes from the staging repository of its vote
# until it is on Maven Central. Run by hand (Actions, Build, Run workflow) with a branch or tag of
# apache/wicket, master for example, the workflow first builds the Wicket modules the project uses
# from it, installs them into the Maven repository and builds the project against their version.
# The cache keeps that repository, with the commit Wicket was built from, so Wicket is built again
# only when its branch moves on; it is saved even when the tests fail. When the build fails, its
# errors are also given as annotations of the run, which show on the pull request and are readable
# through the API without downloading the log.
#
# The actions are pinned by the commit of their release, the version in a comment, so that a tag
# moved later cannot change what runs here; Dependabot (.github/dependabot.yml) proposes the new
# releases.

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      wicket-ref:
        description: A branch or tag of apache/wicket to build and test against; the pom's Wicket when empty
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WICKET_REPOSITORY: https://github.com/apache/wicket.git
      WICKET_REF: ${{ inputs.wicket-ref }}
      # read by every mvn run (Maven 3.9+)
      MAVEN_ARGS: --batch-mode --errors --no-transfer-progress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the build needs no token after the checkout
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Find the commit of Wicket to build against
        id: wicket
        if: env.WICKET_REF != ''
        run: |
          commit=$(git ls-remote "$WICKET_REPOSITORY" "refs/heads/$WICKET_REF" "refs/tags/$WICKET_REF" | head -n 1 | cut -f 1)
          if [ -z "$commit" ]; then
            echo "apache/wicket has no branch or tag '$WICKET_REF'" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore the Maven repository
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: maven-${{ steps.wicket.outputs.commit || 'pom' }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ steps.wicket.outputs.commit || 'pom' }}-
            maven-

      - name: Build Wicket ${{ env.WICKET_REF }}
        id: build-wicket
        if: env.WICKET_REF != ''
        env:
          COMMIT: ${{ steps.wicket.outputs.commit }}
        run: |
          built=~/.m2/repository/.wicket-built
          { read -r cached version < "$built"; } 2> /dev/null || true
          if [ "$cached" = "$COMMIT" ] && [ -n "$version" ]; then
            echo "Wicket $COMMIT is in the cache already, as $version"
          else
            git clone --quiet --depth 1 --branch "$WICKET_REF" "$WICKET_REPOSITORY" "$RUNNER_TEMP/wicket"
            # the modules the project uses, and those they need (-am)
            mvn -f "$RUNNER_TEMP/wicket/pom.xml" install -DskipTests --also-make \
              --projects wicket-core,wicket-extensions,wicket-tester,wicket-native-websocket/wicket-native-websocket-core,wicket-native-websocket/wicket-native-websocket-javax,wicket-native-websocket/wicket-native-websocket-tester \
              -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Djacoco.skip=true -Djapicmp.skip=true -Drat.skip=true
            version=$(mvn -q -f "$RUNNER_TEMP/wicket/pom.xml" help:evaluate -Dexpression=project.version -DforceStdout)
            echo "$COMMIT $version" > "$built"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          WICKET_VERSION: ${{ steps.build-wicket.outputs.version }}
        run: |
          set -o pipefail
          mvn verify ${WICKET_VERSION:+-Dwicket.version=$WICKET_VERSION} 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Save the Maven repository
        if: always() && steps.build-wicket.outcome != 'failure' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Report the errors of the build
        if: failure()
        shell: python3 {0}
        run: |
          import glob, os, re
          import xml.etree.ElementTree as ET

          def escape(text, property=False):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return text.replace(":", "%3A").replace(",", "%2C") if property else text

          def annotate(title, message):
              print(f"::error title={escape(title, True)}::{escape(message[:20000])}")

          def clip(text, length):
              """the start and the end of a long text: an assertion's message ends with what it expected"""
              return text if len(text) <= length else text[:length // 3] + "\n[...]\n" + text[-2 * length // 3:]

          # a step gives at most 10 error annotations: up to 8 failing tests, then the log
          problems = []
          for report in sorted(glob.glob("*/target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(report).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      message = (problem.get("message") or "").strip()
                      trace = (problem.text or "").strip()
                      problems.append((f"{case.get('classname')}.{case.get('name')}", clip(message, 4000) + "\n\n" + trace[:3000]))
          for title, detail in problems[:8]:
              annotate(title, detail)
          if len(problems) > 8:
              print(f"{len(problems) - 8} more failing tests are in the test reports")

          # the lines of the log that tell what failed, not the pages some tests print
          log = os.path.join(os.environ["RUNNER_TEMP"], "build.log")
          if os.path.exists(log):
              wanted = re.compile(r"^\[ERROR\]|error TS\d+|^\s*(FAIL|×|✗)\s|Tests run:.*(Failures|Errors): [1-9]|npm ERR!|ERR_|Error: ")
              lines = []
              for line in open(log, encoding="utf-8", errors="replace"):
                  line = re.sub(r"\x1b\[[0-9;]*m", "", line.rstrip())
                  if wanted.search(line):
                      lines.append(line[:300])
              annotate("The errors in the log", "\n".join(lines[:150]) or "no line of the log matches")

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            frontend/*/coverage/
          if-no-files-found: ignore
