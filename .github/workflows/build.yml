# Builds and tests every push to master and every pull request, as mvn verify does on a developer's
# machine: the Java modules with their tests, and the frontend with its own, which the Maven build
# runs with the Node it installs.
#
# The project depends on Wicket 11.0.0-SNAPSHOT, which no repository serves, so the first step
# builds the Wicket modules it uses from apache/wicket and installs them into the Maven repository.
# The cache keeps that repository with the commit Wicket was built from, so Wicket is built again
# only when its branch moves on. To build against another branch or tag of Wicket, run the workflow
# by hand (Actions, Build, Run workflow).

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      wicket-ref:
        description: The branch or tag of apache/wicket to build against
        default: master

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WICKET_REPOSITORY: https://github.com/apache/wicket.git
      WICKET_REF: ${{ inputs.wicket-ref || 'master' }}
      # read by every mvn run (Maven 3.9+)
      MAVEN_ARGS: --batch-mode --errors --no-transfer-progress
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find the commit of Wicket to build against
        id: wicket
        run: |
          commit=$(git ls-remote "$WICKET_REPOSITORY" "refs/heads/$WICKET_REF" "refs/tags/$WICKET_REF" | head -n 1 | cut -f 1)
          if [ -z "$commit" ]; then
            echo "apache/wicket has no branch or tag '$WICKET_REF'" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ steps.wicket.outputs.commit }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ steps.wicket.outputs.commit }}-
            maven-

      - name: Build Wicket ${{ env.WICKET_REF }}
        env:
          COMMIT: ${{ steps.wicket.outputs.commit }}
        run: |
          built=~/.m2/repository/.wicket-built
          if [ "$(cat "$built" 2> /dev/null)" = "$COMMIT" ]; then
            echo "Wicket $COMMIT is in the cache already"
            exit 0
          fi
          git clone --quiet --depth 1 --branch "$WICKET_REF" "$WICKET_REPOSITORY" "$RUNNER_TEMP/wicket"
          # the modules the project uses, and those they need (-am)
          mvn -f "$RUNNER_TEMP/wicket/pom.xml" install -DskipTests --also-make \
            --projects wicket-core,wicket-extensions,wicket-tester,wicket-native-websocket/wicket-native-websocket-core,wicket-native-websocket/wicket-native-websocket-javax,wicket-native-websocket/wicket-native-websocket-tester \
            -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Djacoco.skip=true -Djapicmp.skip=true -Drat.skip=true
          echo "$COMMIT" > "$built"

      - name: Build and test
        run: mvn verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            frontend/*/coverage/
          if-no-files-found: ignore
